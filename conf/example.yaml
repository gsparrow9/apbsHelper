#Example Config File
name: rna_example_config

config_only: false #Only configure the simulations. Does not run APBS
log_level: info
max_threads: 4 #Max amount of parallel simulations

cases_to_run:
    - case_01
    - case_02
    - case_03

pdb_handler: src.handlers.test_handler.TestHandler
pdb_directory: pdbFiles
core_pdb_filename: 2rna.pdb

#Global simulation settings (Overriden by case settings if present)
global_sim_options:
    mesh_size: 0.300
    coarse_grain: false
    linear_pb: true
    keep_complex_dx: false

global_handler_options:
    base:                           #Parameters under base apply to all simulations of case.
        cg_charges: [[-9.75]]
        rotation_angle: 0
    variants:
      distance: [0, 15, 20, 30]     #Define number of simulations in case. Each item is one simulation under the case.

#Cases definition
cases:
    - name: case_01
      sim_options:                #Simulation options for the case. Overrides global settings.
        coarse_grain: true
        linear_pb: true
        keep_complex_dx: true
      handler_options:            #Options passed to handler function for all simulations under the case.
        base:
            cg_charges: [[-9.75]]
            rotation_angle: 90
        variants:
            distance: [0, 10]   #Can be pairwise. [{'distance':0,'atom_set':'A'},{...}]
            atom_set: ['A','B']

    - name: case_02
      sim_options:                #Simulation options for the case. Overrides global settings.
        coarse_grain: true
        linear_pb: false
        keep_complex_dx: true
      handler_options:            #Options passed to handler function for all simulations under the case.
        base:
            rotation_angle: 120
            test_option: ExampleTest

    - name: case_03
      sim_options:                #Simulation options for the case. Overrides global settings.
        coarse_grain: true
        pb_type: linear
        keep_complex_dx: true
      handler_options:            #Options passed to handler function for all simulations under the case.
        base:
            cg_charges: [[-9.85]]
